# .cicd/pipeline.yaml ÔÇö konfigurasi Jenkins CI untuk frontend UI
app_name: frontend
language: nodejs

test:
  command: "npm test"

gitops:
  repo_url: https://github.com/rezanaipospos/gitops.git
  branch: main
  path: applications/development/frontend
  deploy_file: patch/deployment.yaml

build:
  tool: docker
  branch: development

kind_cluster_name: devops-local-cluster
enable_security_scan: false